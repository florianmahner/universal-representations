[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-representations"
version = "0.1.0"
license = {file = "LICENSE"}
description = "Analysis code for universal dimensions in visual representations"
requires-python = ">=3.10"
dependencies = [
    "pysrf @ git+https://github.com/florianmahner/pysrf.git@0fc24ac06c56f76f06968976fc5615343cdf453e",
    "joblib>=1.3",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "omegaconf>=2.3",
    "pandas>=2.0",
    "pillow>=10",
    "requests>=2.31",
    "scikit-learn>=1.6",
    "scipy>=1.12",
    "seaborn>=0.13",
    "statsmodels>=0.14",
    "threadpoolctl>=3.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
test = ["pytest>=8"]
features = [
    "ftfy>=6.2",
    "open-clip-torch>=2.32,<3",
    "regex>=2024.0",
    "tensorflow>=2.16,<3",
    "tensorflow-hub>=0.16,<1",
    "timm>=1.0",
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.40",
    "visualpriors>=0.3,<1",
]
analysis = ["adjustText>=1.3", "sentence-transformers>=3"]
reports = ["nltk>=3.9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "experiments*"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "experiments/rebuttal/categorical_control",
    "experiments/rebuttal/llm_dimension_descriptions",
]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-ra"
